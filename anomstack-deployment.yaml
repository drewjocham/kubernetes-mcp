apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomstack
  namespace: kw-anomaly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anomstack
  template:
    metadata:
      labels:
        app: anomstack
    spec:
      containers:
      - name: anomstack
        image: python:3.12-slim
        command: ["sh", "-c"]
        args:
        - |
          apt-get update && apt-get install -y curl &&
          echo "Starting simple anomstack mock service" &&
          python3 -c "
          from http.server import HTTPServer, BaseHTTPRequestHandler
          import json
          import time
          import random

          class MockAnomstackHandler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == '/health':
                      self.send_response(200)
                      self.send_header('Content-type', 'application/json')
                      self.end_headers()
                      self.wfile.write(json.dumps({'status': 'healthy'}).encode())
                  elif self.path == '/anomalies':
                      # Generate mock anomalies
                      anomalies = []
                      for i in range(random.randint(0, 5)):
                          anomalies.append({
                              'id': f'anomaly-{i}',
                              'title': f'Mock Anomaly {i}',
                              'severity': random.choice(['low', 'medium', 'high', 'critical']),
                              'message': f'Detected anomaly in metric {i}',
                              'timestamp': time.time() * 1000
                          })
                      self.send_response(200)
                      self.send_header('Content-type', 'application/json')
                      self.end_headers()
                      self.wfile.write(json.dumps({'anomalies': anomalies}).encode())
                  else:
                      self.send_response(404)
                      self.end_headers()

              def log_message(self, format, *args):
                  pass  # Suppress logs

          server = HTTPServer(('0.0.0.0', 8080), MockAnomstackHandler)
          print('Mock anomstack server running on port 8080')
          server.serve_forever()
          "
        ports:
        - containerPort: 8080
        env:
        - name: PROMETHEUS_URL
          value: "http://prometheus-server.prometheus.svc.cluster.local:80"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: anomstack
  namespace: kw-anomaly
spec:
  selector:
    app: anomstack
  ports:
    - name: http
      port: 8080
      targetPort: 8080