apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomstack-mono
  namespace: kw-anomaly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anomstack-mono
  template:
    metadata:
      labels:
        app: anomstack-mono
    spec:
      containers:
      - name: anomstack
        image: anomstack-mono:kw-local
        ports:
        - containerPort: 80
          name: http
        env:
        - name: ANOMSTACK_DUCKDB_PATH
          value: "/data/anomstack.db"
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: anomstack-data</content>