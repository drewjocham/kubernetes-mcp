resource_tracking:
  enabled: true
  retention: 1h
  fields:
    - cpu_request
    - cpu_limit
    - memory_request
    - memory_limit
    - ram
    - min_pod_count
    - max_pod_count
    - current_replicas
    - desired_replicas
    - node_memory_pressure
    - node_disk_pressure
    - waiting_reason
rules:
  - name: Pod-Restarting-Frequently
    kind: Pod
    condition: "evt.restart_delta > 3 && evt.waiting_reason == 'CrashLoopBackOff'"
    actions:
      - google-space-alert-chat
      - ops-pager
      - dashboard-webhook
  - name: Image-Pull-Failure
    kind: Pod
    duration: 2m
    condition: "evt.waiting_reasons.exists(r, r.contains('ImagePull'))"
    actions:
      - google-space-alert-chat
  - name: HPA-Stalled-At-Ceiling
    kind: HorizontalPodAutoscaler
    duration: 5m
    condition: "evt.hpa_is_stalled == true"
    actions:
      - ops-pager
  - name: Node-Memory-Pressure
    kind: Node
    condition: "evt.node_memory_pressure == true"
    actions:
      - ops-pager
  - name: Dangerous-Resource-Gap
    kind: Pod
    condition: "evt.node_memory_pressure == true && evt.mem_limit_gap > 2048"
    actions:
      - personal-channel
  - name: Pod-Stuck-In-Pending
    kind: Pod
    duration: 10m
    condition: "evt.is_ready == false && evt.waiting_reason == 'ContainerCreating'"
    actions:
      - personal-channel
  - name: Model-Detected-Critical-Pod-Issue
    kind: Pod
    condition: "evt.model_issue_detected == true && evt.model_issue_severity == 'critical'"
    actions:
      - ops-pager
      - google-space-alert-chat
  - name: Model-Detected-Critical-Node-Issue
    kind: Node
    condition: "evt.model_issue_detected == true && evt.model_issue_severity == 'critical'"
    actions:
      - ops-pager
  - name: Model-Detected-Critical-HPA-Issue
    kind: HorizontalPodAutoscaler
    condition: "evt.model_issue_detected == true && evt.model_issue_severity == 'critical'"
    actions:
      - ops-pager
actions:
  google-space-alert-chat:
    type: alert
    severity: critical
  ops-pager:
    type: alert
    severity: critical
  personal-channel:
    type: alert
    severity: warning
  log_change:
    type: log
    template: "{{ .rule.name }} triggered for {{ .resource.metadata.name }}"
  # Example: merge a local file or set config.url via your deploy pipeline.
  # Never commit real webhook URLs or API keys to the repository.
  google-chat:
    type: notification
    template: "Rule '{{ .RuleName }}' triggered for resource '{{ .Context.resource.kind }}/{{ .Context.resource.metadata.name }}'"
    config:
      url: ""
  dashboard-webhook:
    type: webhook
    template: |
      {
        "kind": "Unknown",
        "cluster": "local",
        "namespace": "{{ .Event.Namespace }}",
        "pod": "{{ .Event.Name }}",
        "ruleName": "{{ .RuleName }}",
        "severity": "critical",
        "source": "kube-watcher"
      }
    config:
      url: "http://host.docker.internal:3000/api/alerts/ingest"
settings:
  metrics:
    enabled: true
    listen: ":9090"
  model:
    enabled: false
    endpoint: "https://api.openai.com/v1/chat/completions"
    timeout: 5s
    api_key_env: "OPENAI_API_KEY_REMOVED"
    min_confidence: 0.65
    system_prompt: "You are a Kubernetes SRE anomaly detector. Return only strict JSON."
  heartbeat:
    enabled: true
    dashboard_url: "http://host.docker.internal:3000"
    cluster_name: "local"
    interval: 30s
