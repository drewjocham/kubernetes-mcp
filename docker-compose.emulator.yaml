# Pub/Sub emulator for local development and testing
version: '3.8'

services:
  pubsub-emulator:
    image: google/cloud-sdk:latest
    command: >
      gcloud beta emulators pubsub start
      --project=test-project
      --host-port=0.0.0.0:8085
      --verbosity=debug
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

