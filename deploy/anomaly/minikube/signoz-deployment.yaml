apiVersion: apps/v1
kind: Deployment
metadata:
  name: signoz
  namespace: kw-anomaly
  labels:
    app: signoz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signoz
  template:
    metadata:
      labels:
        app: signoz
    spec:
      containers:
      - name: signoz
        image: signoz/signoz:v0.117.1
        ports:
        - containerPort: 3301
          name: frontend
        - containerPort: 4317
          name: otel-grpc
        - containerPort: 4318
          name: otel-http
        - containerPort: 8080
          name: query-service
        env:
        - name: ClickHouseUrl
          value: "tcp://signoz-clickhouse:9000"
        - name: STORAGE
          value: "clickhouse"
        - name: DEPLOY_ENV
          value: "kubernetes"
        volumeMounts:
        - name: signoz-data
          mountPath: /var/lib/signoz
        - name: clickhouse-data
          mountPath: /var/lib/clickhouse
      - name: clickhouse
        image: clickhouse/clickhouse-server:23.8-alpine
        ports:
        - containerPort: 9000
          name: ch-tcp
        - containerPort: 8123
          name: ch-http
        env:
        - name: CLICKHOUSE_USER
          value: "default"
        - name: CLICKHOUSE_PASSWORD
          value: ""
        volumeMounts:
        - name: clickhouse-data
          mountPath: /var/lib/clickhouse
      volumes:
      - name: signoz-data
        emptyDir: {}
      - name: clickhouse-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: signoz
  namespace: kw-anomaly
  labels:
    app: signoz
spec:
  ports:
  - name: frontend
    port: 3301
    targetPort: 3301
  - name: otel-grpc
    port: 4317
    targetPort: 4317
  - name: otel-http
    port: 4318
    targetPort: 4318
  - name: query-service
    port: 8080
    targetPort: 8080
  selector:
    app: signoz