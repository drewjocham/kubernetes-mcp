apiVersion: v1
kind: ConfigMap
metadata:
  name: signoz-otel-config
  namespace: kw-anomaly
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      prometheus:
        config:
          scrape_configs:
            - job_name: 'prometheus'
              scrape_interval: 15s
              static_configs:
                - targets: ['prometheus-server.prometheus.svc.cluster.local:80']
            - job_name: 'anomstack'
              scrape_interval: 15s
              static_configs:
                - targets: ['anomstack.kw-anomaly.svc.cluster.local:8080']

    processors:
      batch:
        send_batch_size: 1000
        timeout: 1s
      resourcedetection:
        detectors: [env, system]
        timeout: 5s

    exporters:
      clickhouse:
        datasource: tcp://signoz-clickhouse:9000
      otlp:
        endpoint: signoz-otel-collector-mq:4318
        tls:
          insecure: true

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch, resourcedetection]
          exporters: [clickhouse]
        metrics:
          receivers: [otlp, prometheus]
          processors: [batch, resourcedetection]
          exporters: [clickhouse]
        logs:
          receivers: [otlp]
          processors: [batch, resourcedetection]
          exporters: [clickhouse]