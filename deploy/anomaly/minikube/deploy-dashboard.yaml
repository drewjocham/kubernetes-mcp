apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomstack-dashboard
  namespace: kw-anomaly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anomstack-dashboard
  template:
    metadata:
      labels:
        app: anomstack-dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: anomstack_dashboard_image:kw-local
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "dashboard.app:app", "--host", "0.0.0.0", "--port", "8080"]
          envFrom:
            - configMapRef:
                name: anomstack-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: anomstack-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: anomstack-dashboard
  namespace: kw-anomaly
spec:
  selector:
    app: anomstack-dashboard
  ports:
    - name: http
      port: 8080
      targetPort: 8080
