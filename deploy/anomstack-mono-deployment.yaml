apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomstack-mono
  namespace: kw-anomaly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anomstack-mono
  template:
    metadata:
      labels:
        app: anomstack-mono
    spec:
      containers:
      - name: anomstack
        image: anomstack-mono:kw-local
        ports:
        - containerPort: 80
          name: http
        env:
        - name: ANOMSTACK_DUCKDB_PATH
          value: "/data/anomstack.db"
        - name: ANOMSTACK_ADMIN_USERNAME
          value: "admin"
        - name: ANOMSTACK_ADMIN_PASSWORD
          value: "admin123"
        volumeMounts:
        - name: data
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: anomstack-data

---
apiVersion: v1
kind: Service
metadata:
  name: anomstack-mono
  namespace: kw-anomaly
spec:
  selector:
    app: anomstack-mono
  ports:
  - port: 80
    targetPort: 80
    name: http
  type: ClusterIP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: anomstack-data
  namespace: kw-anomaly
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi</content>
