global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'local-dev'
    monitor: 'kube-watcher'

scrape_configs:
  - job_name: 'watcher'
    static_configs:
      - targets: ['watcher:8085']
        labels:
          service: 'watcher-engine'
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: 'watcher-metrics'
    static_configs:
      - targets: ['watcher:9095']
        labels:
          service: 'watcher-prometheus-exporter'
    metrics_path: /metrics
    scrape_interval: 10s
