x-build-args: &common-build-args
  BUILD_IMAGE: ${BUILD_IMAGE:-golang:1.25.7-alpine3.23}
  RUNTIME_IMAGE: ${RUNTIME_IMAGE:-gcr.io/distroless/static-debian12:nonroot}
  DEBUG_RUNTIME_IMAGE: ${DEBUG_RUNTIME_IMAGE:-gcr.io/distroless/static-debian12:debug-nonroot}
  VERSION: ${VERSION:-dev}
  GIT_COMMIT: ${GIT_COMMIT:-local}
  BUILD_DATE: ${BUILD_DATE:-2026-02-22T00:00:00Z}

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db

  mcp:
    image: watcher-mcp:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.template
      args:
        <<: *common-build-args
        SERVICE_ROOT: mcp
        SERVICE_CMD: ./cmd/server
    command: ["--server"]
    environment:
      LOG_LEVEL: ${MCP_LOG_LEVEL:-info}
    ports:
      - "${MCP_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/app/main", "--health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      mongo:
        condition: service_started
    volumes:
      - ${KUBECONFIG_PATH}:/home/nonroot/.kube/config:ro

  watcher:
    image: watcher:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.template
      args:
        <<: *common-build-args
        SERVICE_ROOT: watcher
        SERVICE_CMD: ./cmd/engine
    command:
      [
        "--listen", ":8085",
        "--config", "/watcher/internal/config/config.yaml"
      ]
    environment:
      LOG_LEVEL: ${WATCHER_LOG_LEVEL:-info}
    ports:
      - "${WATCHER_HTTP_PORT:-8085}:8085"
    volumes:
      - ../watcher/internal/config/config.yaml:/watcher/internal/config/config.yaml:ro
      - watcher-data:/event-engine-badger
      - ${KUBECONFIG_PATH}:/home/nonroot/.kube/config:ro
    healthcheck:
      test: ["CMD", "/app/main", "--health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      mongo:
        condition: service_started

volumes:
  watcher-data: {}
  mongo-data: {}
