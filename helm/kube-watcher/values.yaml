namespaces:
  kubeWatcher: kube-watcher
  anomstack: kw-anomaly

serviceAccount:
  name: kube-watcher
  create: true

# ─── MCP Server ─────────────────────────────────────────────────────────────
mcp:
  enabled: true
  image:
    repository: watcher-mcp
    tag: latest
    pullPolicy: IfNotPresent
  port: 8080
  logLevel: info
  # BadgerDB history path inside the container
  dbPath: /home/nonroot/.kube-watcher/history.db
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ─── Watcher Event Engine (+ Badger Explorer sidecar) ───────────────────────
watcher:
  enabled: true
  image:
    repository: watcher
    tag: latest
    pullPolicy: IfNotPresent
  ports:
    http: 8085
    metrics: 9095
  logLevel: info
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # Set enabled: true to use a PVC instead of emptyDir for the BadgerDB data.
  # ReadWriteOnce is sufficient for single-node clusters (minikube / kind).
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""

badgerExplorer:
  enabled: true
  image:
    repository: watcher-badger-explorer
    tag: latest
    pullPolicy: IfNotPresent
  port: 4101
  historyLimit: 120

# ─── Prometheus ─────────────────────────────────────────────────────────────
prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: latest
    pullPolicy: IfNotPresent
  port: 9090
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ─── Grafana ─────────────────────────────────────────────────────────────────
grafana:
  enabled: true
  image:
    repository: grafana/grafana-oss
    tag: latest
    pullPolicy: IfNotPresent
  port: 3000
  adminUser: admin
  adminPassword: admin
  plugins: "grafana-piechart-panel"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""

# ─── Anomstack (Dagster-based anomaly detection) ─────────────────────────────
anomstack:
  enabled: true
  dagster:
    image:
      repository: anomstack_dagster_image
      tag: kw-local
      pullPolicy: IfNotPresent
  dashboard:
    image:
      repository: anomstack_dashboard_image
      tag: kw-local
      pullPolicy: IfNotPresent
  env:
    duckdbPath: /data/anomstack.db
    home: /opt/dagster/app
    tableKey: tmp.metrics
    dashboardPort: "8080"
    llmPlatform: openai
    llmalertModels: gpt-4o-mini
  persistence:
    size: 5Gi
    storageClass: ""
  resources:
    daemon:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    webserver:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    dashboard:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
