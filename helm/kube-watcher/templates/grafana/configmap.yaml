{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: {{ .Values.namespaces.kubeWatcher }}
  labels:
    app: grafana
    {{- include "kube-watcher.labels" . | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:{{ .Values.prometheus.port }}
        isDefault: true
        editable: true
        jsonData:
          httpMethod: POST
          timeInterval: 15s

  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: WatcherDashboards
        orgId: 1
        folder: Watcher
        type: file
        options:
          path: /etc/grafana/provisioning/dashboards/json
        updateIntervalSeconds: 30

  watcher-overview.json: |
    {
      "id": null,
      "uid": "watcher-overview",
      "title": "Watcher Golden Signals",
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "15s",
      "tags": ["watcher", "golden-signal"],
      "panels": [
        {
          "type": "timeseries",
          "title": "Pod Restart Count",
          "targets": [
            {
              "expr": "sum by (namespace, pod) (kube_watcher_pod_restart_count)",
              "legendFormat": "{{ "{{" }}namespace{{ "}}" }}/{{ "{{" }}pod{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "lineWidth": 2,
              "color": {"mode": "palette-classic"}
            },
            "overrides": []
          },
          "gridPos": {"h": 9, "w": 24, "x": 0, "y": 0}
        },
        {
          "type": "timeseries",
          "title": "CPU Limit Gap (mCPU)",
          "targets": [
            {
              "expr": "sum by (namespace, pod) (kube_watcher_pod_cpu_limit_gap_milli)",
              "legendFormat": "{{ "{{" }}namespace{{ "}}" }}/{{ "{{" }}pod{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "mc",
              "lineWidth": 2,
              "color": {"mode": "palette-classic"}
            },
            "overrides": []
          },
          "gridPos": {"h": 9, "w": 24, "x": 0, "y": 9}
        }
      ],
      "templating": {"list": []},
      "time": {"from": "now-30m", "to": "now"}
    }
{{- end }}
