{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Values.namespaces.kubeWatcher }}
  labels:
    app: prometheus
    {{- include "kube-watcher.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'local-dev'
        monitor: 'kube-watcher'

    scrape_configs:
      - job_name: 'watcher-metrics'
        static_configs:
          - targets: ['watcher:{{ .Values.watcher.ports.metrics }}']
            labels:
              service: 'watcher-prometheus-exporter'
        metrics_path: /metrics
        scrape_interval: 10s
      - job_name: 'anomstack-dashboard'
        static_configs:
          - targets: ['anomstack-dashboard.{{ .Values.namespaces.anomstack }}.svc.cluster.local:{{ .Values.anomstack.env.dashboardPort }}']
            labels:
              service: 'anomstack-dashboard'
              namespace: '{{ .Values.namespaces.anomstack }}'
        metrics_path: /metrics
        scrape_interval: 15s
      - job_name: 'anomstack-webserver'
        static_configs:
          - targets: ['anomstack-webserver.{{ .Values.namespaces.anomstack }}.svc.cluster.local:3000']
            labels:
              service: 'anomstack-webserver'
              namespace: '{{ .Values.namespaces.anomstack }}'
        metrics_path: /metrics
        scrape_interval: 15s
      - job_name: 'kubernetes-control-plane'
        kubernetes_sd_configs:
        - role: endpoints
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
        - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
          action: keep
          regex: kube-system;kube-control-plane;https
{{- end }}
