{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Values.namespaces.kubeWatcher }}
  labels:
    app: prometheus
    {{- include "kube-watcher.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'local-dev'
        monitor: 'kube-watcher'

    scrape_configs:
      - job_name: 'watcher'
        static_configs:
          - targets: ['watcher:{{ .Values.watcher.ports.http }}']
            labels:
              service: 'watcher-engine'
        metrics_path: /metrics
        scrape_interval: 15s
        scrape_timeout: 10s

      - job_name: 'watcher-metrics'
        static_configs:
          - targets: ['watcher:{{ .Values.watcher.ports.metrics }}']
            labels:
              service: 'watcher-prometheus-exporter'
        metrics_path: /metrics
        scrape_interval: 10s
{{- end }}
