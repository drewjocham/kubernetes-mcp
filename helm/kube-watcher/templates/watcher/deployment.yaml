{{- if .Values.watcher.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: watcher
  namespace: {{ .Values.namespaces.kubeWatcher }}
  labels:
    app: watcher
    {{- include "kube-watcher.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: watcher
  template:
    metadata:
      labels:
        app: watcher
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.watcher.ports.metrics }}"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "kube-watcher.serviceAccountName" . }}
      # watcher needs to write to BadgerDB; run as root for local dev simplicity
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: engine
          image: {{ .Values.watcher.image.repository }}:{{ .Values.watcher.image.tag }}
          imagePullPolicy: {{ .Values.watcher.image.pullPolicy }}
          args:
            - "--listen"
            - ":{{ .Values.watcher.ports.http }}"
            - "--config"
            - "/watcher/config/config.yaml"
          env:
            - name: LOG_LEVEL
              value: {{ .Values.watcher.logLevel }}
            - name: HOME
              value: /home/nonroot
          ports:
            - name: http
              containerPort: {{ .Values.watcher.ports.http }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.watcher.ports.metrics }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.watcher.ports.http }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.watcher.ports.http }}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.watcher.resources | nindent 12 }}
          volumeMounts:
            - name: watcher-config
              mountPath: /watcher/config
              readOnly: true
            - name: watcher-data
              mountPath: /event-engine-badger
            - name: tmp
              mountPath: /tmp

        {{- if .Values.badgerExplorer.enabled }}
        - name: badger-explorer
          image: {{ .Values.badgerExplorer.image.repository }}:{{ .Values.badgerExplorer.image.tag }}
          imagePullPolicy: {{ .Values.badgerExplorer.image.pullPolicy }}
          args:
            - "--db"
            - "/event-engine-badger"
            - "--listen"
            - ":{{ .Values.badgerExplorer.port }}"
            - "--history-limit"
            - "{{ .Values.badgerExplorer.historyLimit }}"
          ports:
            - name: explorer
              containerPort: {{ .Values.badgerExplorer.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.badgerExplorer.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: watcher-data
              mountPath: /event-engine-badger
            - name: tmp
              mountPath: /tmp
        {{- end }}

      volumes:
        - name: watcher-config
          configMap:
            name: watcher-config
        - name: watcher-data
          {{- if .Values.watcher.persistence.enabled }}
          persistentVolumeClaim:
            claimName: watcher-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
{{- end }}
