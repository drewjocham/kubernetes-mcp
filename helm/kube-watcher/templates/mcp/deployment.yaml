{{- if .Values.mcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  namespace: {{ .Values.namespaces.kubeWatcher }}
  labels:
    app: mcp
    {{- include "kube-watcher.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp
  template:
    metadata:
      labels:
        app: mcp
    spec:
      serviceAccountName: {{ include "kube-watcher.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: mcp
          image: {{ .Values.mcp.image.repository }}:{{ .Values.mcp.image.tag }}
          imagePullPolicy: {{ .Values.mcp.image.pullPolicy }}
          args:
            - "--http-addr"
            - ":{{ .Values.mcp.port }}"
            - "--db-path"
            - "{{ .Values.mcp.dbPath }}"
          env:
            - name: LOG_LEVEL
              value: {{ .Values.mcp.logLevel }}
            - name: HOME
              value: /home/nonroot
          ports:
            - name: http
              containerPort: {{ .Values.mcp.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.mcp.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.mcp.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: mcp-data
              mountPath: /home/nonroot/.kube-watcher
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: mcp-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
