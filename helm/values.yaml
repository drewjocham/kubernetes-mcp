# ─── Namespaces ─
namespaces:
  kubeWatcher: kube-watcher
  # Changed to match kubeWatcher to avoid ownership conflicts during install
  anomstack: kube-watcher

serviceAccount:
  name: kube-watcher
  create: true

imagePullSecrets: []
  # - name: regcred

# ─── MCP Server 
mcp:
  enabled: true
  replicaCount: 1
  image:
    repository: watcher-mcp
    tag: latest
    pullPolicy: IfNotPresent
  port: 8080
  logLevel: warn
  # BadgerDB history path inside the container
  dbPath: /home/nonroot/.kube-watcher/history.db
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""

# ─── Cloud Service
cloud:
  enabled: false
  replicaCount: 1
  image:
    repository: watcher-cloud
    tag: latest
    pullPolicy: IfNotPresent
  port: 9090
  wsPort: 9091
  logLevel: info
  # JWT secret for authentication (should be set via secret in production)
  jwtSecret: "change-me-in-production"
  # OAuth configuration
  oauth:
    github:
      enabled: false
      clientId: ""
      clientSecret: ""
    google:
      enabled: false
      clientId: ""
      clientSecret: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""
  ingress:
    enabled: true
    host: cloud.kube-watcher.local
    path: /
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
      nginx.ingress.kubernetes.io/websocket-services: "cloud"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    tls: []

# ─── Watcher Event Engine
watcher:
  enabled: true
  replicaCount: 1
  image:
    repository: watcher
    tag: latest
    pullPolicy: IfNotPresent
  ports:
    http: 8085
    metrics: 9095
  logLevel: warn
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""
  configYaml: |
    resource_tracking:
      enabled: true
      storage: disk
      path: /event-engine-badger
      retention: 1h
      fields:
        - cpu_request
        - cpu_limit
        - memory_request
        - memory_limit
        - ram
        - min_pod_count
        - max_pod_count
        - current_replicas
        - desired_replicas
        - node_memory_pressure
        - node_disk_pressure
        - waiting_reason
        - waiting_reasons
        - restart_delta
        - restart_count
        - is_ready
        - crash_looping
        - hpa_is_stalled
    rules:
      - name: Pod-Restarting-Frequently
        kind: Pod
        condition: "has(evt.restart_count) && evt.restart_count > 3 && has(evt.crash_looping) && evt.crash_looping == true"
        actions:
          - log_change
      - name: Image-Pull-Failure
        kind: Pod
        duration: 2m
        condition: "has(evt.waiting_reason) && evt.waiting_reason.contains('ImagePull')"
        actions:
          - log_change
      - name: HPA-Stalled-At-Ceiling
        kind: HorizontalPodAutoscaler
        duration: 5m
        condition: "has(evt.hpa_is_stalled) && evt.hpa_is_stalled == true"
        actions:
          - log_change
      - name: Node-Memory-Pressure
        kind: Node
        condition: "has(evt.node_memory_pressure) && evt.node_memory_pressure == true"
        actions:
          - log_change
      - name: Pod-Stuck-In-Pending
        kind: Pod
        duration: 10m
        condition: "has(evt.is_ready) && evt.is_ready == false && has(evt.waiting_reason) && evt.waiting_reason == 'ContainerCreating'"
        actions:
          - log_change
      - name: Anomstack-Critical-Anomaly
        kind: Anomaly
        condition: "evt.severity == 'critical'"
        actions:
          - dashboard-webhook
          - log_change
      - name: Anomstack-Warning-Anomaly
        kind: Anomaly
        condition: "evt.severity == 'warning'"
        actions:
          - log_change
    actions:
      log_change:
        type: log
        template: "{{ "{{" }} .RuleName {{ "}}" }} triggered for {{ "{{" }} .Event.Namespace {{ "}}" }}/{{ "{{" }} .Event.Name {{ "}}" }}"
      dashboard-webhook:
        type: webhook
        config:
          url: "{{ .Values.watcher.webhookUrl }}"
    settings:
      cel:
        enabled: true
      queue_depth: 128
      metrics:
        enabled: true
        listen: ":9095"
      heartbeat:
        enabled: true
      anomstack:
        enabled: false
        endpoint: {{ .Values.anomstack.endpoint }}
        interval: {{ .Values.anomstack.interval }}
      pubsub:
        enabled: true
        project_id: "test-project"
        subscription_id: "anomaly-events-sub"
        topic_id: "anomaly-events-topic"
  webhookUrl: ""
  extraEnv:
    - name: PUBSUB_EMULATOR_HOST
      value: "pubsub-emulator:8085"
    - name: GOOGLE_CLOUD_PROJECT
      value: "test-project"

badgerExplorer:
  enabled: false
  image:
    repository: watcher-badger-explorer
    tag: latest
    pullPolicy: IfNotPresent
  port: 4101
  historyLimit: 120

# ─── Prometheus 
prometheus:
  enabled: true
  replicaCount: 1
  image:
    repository: prom/prometheus
    tag: latest
    pullPolicy: IfNotPresent
  port: 9090
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""
  podAnnotations: {}
  extraLabels: {}

# ─── Anomstack
anomstack:
  enabled: true
  replicaCount: 1
  endpoint: http://anomstack-dashboard:8080
  interval: 30s
  dagster:
    image:
      repository: anomstack_dagster_image
      tag: kw-local
      pullPolicy: IfNotPresent
  dashboard:
    image:
      repository: anomstack_dashboard_image
      tag: kw-local
      pullPolicy: IfNotPresent
  env:
    duckdbPath: /data/anomstack.db
    home: /opt/dagster/app
    tableKey: tmp.metrics
    dashboardPort: "8080"
    llmPlatform: openai
    llmalertModels: gpt-4o-mini
    googleCloudProject: "test-project"
    anomstackPubsubTopic: "anomaly-events-topic"

  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  resources:
    daemon:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    webserver:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    dashboard:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ─── K8sGPT
k8sgpt:
  enabled: false
  replicaCount: 1
  image:
    repository: k8sgpt/k8sgpt
    tag: latest
    pullPolicy: IfNotPresent
  port: 8089
  mcpPort: 8089
  backend: openai
  model: gpt-4o
  apiKey: "OPENAI_API_KEY_REMOVED"
  enableMCP: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ─── Signoz
signoz:
  enabled: false
  replicaCount: 1
  image:
    repository: signoz/signoz
    tag: v0.117.1
    pullPolicy: IfNotPresent
  clickhouse:
    profiles:
      default:
        ignore_unknown_settings: 1
    image:
      repository: clickhouse/clickhouse-server
      tag: 23.3
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1024Mi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  persistence:
    clickhouse:
      enabled: false
      size: 10Gi
      storageClass: ""
    signoz:
      enabled: false
      size: 5Gi
      storageClass: ""
  otelCollector:
    enabled: false
    replicaCount: 1
    image:
      repository: otel/opentelemetry-collector
      tag: 0.102.1
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  ingress:
    enabled: true
    host: signoz.local
    path: /
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
    tls: []

# ─── Pub/Sub Emulator (for testing)
pubsubEmulator:
  enabled: true
  image: google/cloud-sdk:latest
  port: 8085
  project: test-project