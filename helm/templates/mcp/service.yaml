{{- if .Values.mcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: mcp
  namespace: {{ .Values.namespaces.kubeWatcher }}
  labels:
    app: mcp
    {{- include "kube-watcher.labels" . | nindent 4 }}
spec:
  selector:
    app: mcp
  ports:
    - name: http
      port: {{ .Values.mcp.port }}
      targetPort: {{ .Values.mcp.port }}
      protocol: TCP
  type: ClusterIP
{{- end }}
