{{- if .Values.watcher.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: watcher-config
  namespace: {{ .Values.namespaces.kubeWatcher }}
  labels:
    app: watcher
    {{- include "kube-watcher.labels" . | nindent 4 }}
data:
  config.yaml: |
    resource_tracking:
      enabled: true
      storage: disk
      path: /event-engine-badger
      retention: 1h
      fields:
        - cpu_request
        - cpu_limit
        - memory_request
        - memory_limit
        - ram
        - min_pod_count
        - max_pod_count
        - current_replicas
        - desired_replicas
        - node_memory_pressure
        - node_disk_pressure
        - waiting_reason
        - waiting_reasons
        - restart_delta
        - restart_count
        - is_ready
        - crash_looping
        - hpa_is_stalled
    rules:
      - name: Pod-Restarting-Frequently
        kind: Pod
        condition: "has(evt.restart_count) && evt.restart_count > 3 && has(evt.crash_looping) && evt.crash_looping == true"
        actions:
          - log_change
      - name: Image-Pull-Failure
        kind: Pod
        duration: 2m
        condition: "has(evt.waiting_reason) && evt.waiting_reason.contains('ImagePull')"
        actions:
          - log_change
      - name: HPA-Stalled-At-Ceiling
        kind: HorizontalPodAutoscaler
        duration: 5m
        condition: "has(evt.hpa_is_stalled) && evt.hpa_is_stalled == true"
        actions:
          - log_change
      - name: Node-Memory-Pressure
        kind: Node
        condition: "has(evt.node_memory_pressure) && evt.node_memory_pressure == true"
        actions:
          - log_change
      - name: Pod-Stuck-In-Pending
        kind: Pod
        duration: 10m
        condition: "has(evt.is_ready) && evt.is_ready == false && has(evt.waiting_reason) && evt.waiting_reason == 'ContainerCreating'"
        actions:
          - log_change
    actions:
      log_change:
        type: log
        template: "{{ "{{" }} .RuleName {{ "}}" }} triggered for {{ "{{" }} .Event.Namespace {{ "}}" }}/{{ "{{" }} .Event.Name {{ "}}" }}"
    settings:
      cel:
        enabled: true
      queue_depth: 128
      metrics:
        enabled: true
        listen: ":9095"
      heartbeat:
        enabled: false
{{- end }}
