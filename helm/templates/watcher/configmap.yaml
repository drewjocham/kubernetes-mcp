{{- if .Values.watcher.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: watcher-config
  namespace: {{ .Values.namespaces.kubeWatcher }}
  labels:
    app: watcher
    {{- include "kube-watcher.labels" . | nindent 4 }}
data:
  config.yaml: |
    resource_tracking:
      enabled: true
      retention: 1h
      fields:
        - cpu_request
        - cpu_limit
        - memory_request
        - memory_limit
        - ram
        - min_pod_count
        - max_pod_count
        - current_replicas
        - desired_replicas
        - node_memory_pressure
        - node_disk_pressure
        - waiting_reason
    rules:
      - name: Pod-Restarting-Frequently
        kind: Pod
        condition: "evt.restart_delta > 3 && evt.waiting_reason == 'CrashLoopBackOff'"
        actions:
          - log_change
      - name: Image-Pull-Failure
        kind: Pod
        duration: 2m
        condition: "evt.waiting_reasons.exists(r, r.contains('ImagePull'))"
        actions:
          - log_change
      - name: HPA-Stalled-At-Ceiling
        kind: HorizontalPodAutoscaler
        duration: 5m
        condition: "evt.hpa_is_stalled == true"
        actions:
          - log_change
      - name: Node-Memory-Pressure
        kind: Node
        condition: "evt.node_memory_pressure == true"
        actions:
          - log_change
      - name: Pod-Stuck-In-Pending
        kind: Pod
        duration: 10m
        condition: "evt.is_ready == false && evt.waiting_reason == 'ContainerCreating'"
        actions:
          - log_change
    actions:
      log_change:
        type: log
        template: "{{ "{{" }} .RuleName {{ "}}" }} triggered for {{ "{{" }} .Event.Namespace {{ "}}" }}/{{ "{{" }} .Event.Name {{ "}}" }}"
    settings:
      cel:
        enabled: true
      queue_depth: 128
      metrics:
        enabled: true
        listen: ":9095"
      heartbeat:
        enabled: false
{{- end }}
