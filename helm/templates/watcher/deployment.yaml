{{- if .Values.watcher.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: watcher
  namespace: {{ .Values.namespaces.kubeWatcher }}
  labels:
    app: watcher
    {{- include "kube-watcher.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.watcher.replicaCount }}
  selector:
    matchLabels:
      app: watcher
  template:
    metadata:
      labels:
        app: watcher
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.watcher.ports.metrics }}"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "kube-watcher.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- with .Values.watcher.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.watcher.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.watcher.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: engine
          image: {{ .Values.watcher.image.repository }}:{{ .Values.watcher.image.tag }}
          imagePullPolicy: {{ .Values.watcher.image.pullPolicy }}
          args:
            - "--listen"
            - ":{{ .Values.watcher.ports.http }}"
            - "--config"
            - "/watcher/config/config.yaml"
          env:
            - name: LOG_LEVEL
              value: {{ .Values.watcher.logLevel }}
            - name: HOME
              value: /home/nonroot
{{- if .Values.signoz.otelCollector.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://signoz-otel-collector.{{ .Values.namespaces.anomstack }}.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAME
              value: watcher-engine
{{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.watcher.ports.http }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.watcher.ports.metrics }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.watcher.ports.http }}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.watcher.ports.http }}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.watcher.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: watcher-config
              mountPath: /watcher/config
              readOnly: true
            - name: watcher-data
              mountPath: /event-engine-badger
            - name: tmp
              mountPath: /tmp

        {{- if .Values.badgerExplorer.enabled }}
        - name: badger-explorer
          image: {{ .Values.badgerExplorer.image.repository }}:{{ .Values.badgerExplorer.image.tag }}
          imagePullPolicy: {{ .Values.badgerExplorer.image.pullPolicy }}
          args:
            - "--db"
            - "/event-engine-badger"
            - "--listen"
            - ":{{ .Values.badgerExplorer.port }}"
            - "--history-limit"
            - "{{ .Values.badgerExplorer.historyLimit }}"
          ports:
            - name: explorer
              containerPort: {{ .Values.badgerExplorer.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.badgerExplorer.port }}
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: watcher-data
              mountPath: /event-engine-badger
            - name: tmp
              mountPath: /tmp
        {{- end }}

      volumes:
        - name: watcher-config
          configMap:
            name: watcher-config
        - name: watcher-data
          {{- if .Values.watcher.persistence.enabled }}
          persistentVolumeClaim:
            claimName: watcher-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
{{- end }}
