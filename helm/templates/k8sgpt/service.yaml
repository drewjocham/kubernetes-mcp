{{- if .Values.k8sgpt.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: k8sgpt
  namespace: {{ .Values.namespaces.kubeWatcher }}
  labels:
    app: k8sgpt
    {{- include "kube-watcher.labels" . | nindent 4 }}
spec:
  selector:
    app: k8sgpt
  ports:
    - name: mcp
      port: {{ .Values.k8sgpt.port }}
      targetPort: {{ .Values.k8sgpt.mcpPort }}
      protocol: TCP
  type: ClusterIP
{{- end }}