# ─── Namespaces ─
namespaces:
  kubeWatcher: kube-watcher
  # Changed to match kubeWatcher to avoid ownership conflicts during install
  anomstack: kube-watcher

serviceAccount:
  name: kube-watcher
  create: true

imagePullSecrets: []
  # - name: regcred

# ─── MCP Server 
mcp:
  enabled: true
  replicaCount: 1
  image:
    repository: watcher-mcp
    tag: latest
    pullPolicy: IfNotPresent
  port: 8080
  logLevel: info
  # BadgerDB history path inside the container
  dbPath: /home/nonroot/.kube-watcher/history.db
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""

# ─── Watcher Event Engine
watcher:
  enabled: false
  replicaCount: 1
  image:
    repository: watcher
    tag: latest
    pullPolicy: IfNotPresent
  ports:
    http: 8085
    metrics: 9095
  logLevel: info
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""

badgerExplorer:
  enabled: true
  image:
    repository: watcher-badger-explorer
    tag: latest
    pullPolicy: IfNotPresent
  port: 4101
  historyLimit: 120

# ─── Prometheus 
prometheus:
  enabled: true
  replicaCount: 1
  image:
    repository: prom/prometheus
    tag: latest
    pullPolicy: IfNotPresent
  port: 9090
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""
  podAnnotations: {}
  extraLabels: {}
  podAnnotations: {}
  extraLabels: {}

# ─── Anomstack
anomstack:
  enabled: false
  replicaCount: 1
  dagster:
    image:
      repository: anomstack_dagster_image
      tag: kw-local
      pullPolicy: IfNotPresent
  dashboard:
    image:
      repository: anomstack_dashboard_image
      tag: kw-local
      pullPolicy: IfNotPresent
  env:
    duckdbPath: /data/anomstack.db
    home: /opt/dagster/app
    tableKey: tmp.metrics
    dashboardPort: "8080"
    llmPlatform: openai
    llmalertModels: gpt-4o-mini
  persistence:
    size: 5Gi
    storageClass: ""
  resources:
    daemon:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ─── K8sGPT
k8sgpt:
  enabled: false
  replicaCount: 1
  image:
    repository: k8sgpt/k8sgpt
    tag: latest
    pullPolicy: IfNotPresent
  port: 8089
  mcpPort: 8089
  backend: openai
  model: gpt-4o
  apiKey: ""
  enableMCP: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ─── Signoz
signoz:
  enabled: true
  replicaCount: 1
  image:
    repository: signoz/signoz
    tag: v0.117.1
    pullPolicy: IfNotPresent
  clickhouse:
    profiles:
      default:
        ignore_unknown_settings: 1
    image:
      repository: clickhouse/clickhouse-server
      tag: 24.8-alpine
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1024Mi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  persistence:
    clickhouse:
      enabled: false
      size: 10Gi
      storageClass: ""
    signoz:
      enabled: false
      size: 5Gi
      storageClass: ""
  otelCollector:
    enabled: true
    replicaCount: 1
    image:
      repository: otel/opentelemetry-collector
      tag: 0.102.1
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  ingress:
    enabled: true
    host: signoz.local
    path: /
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
    tls: []