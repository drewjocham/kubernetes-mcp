{{- if .Values.anomstack.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomstack-daemon
  namespace: {{ .Values.namespaces.anomstack }}
  labels:
    app: anomstack-daemon
    {{- include "kube-watcher.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.anomstack.replicaCount }}
  selector:
    matchLabels:
      app: anomstack-daemon
  template:
    metadata:
      labels:
        app: anomstack-daemon
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- with .Values.anomstack.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.anomstack.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.anomstack.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: daemon
          image: {{ .Values.anomstack.dagster.image.repository }}:{{ .Values.anomstack.dagster.image.tag }}
          imagePullPolicy: {{ .Values.anomstack.dagster.image.pullPolicy }}
          args: ["dagster-daemon", "run"]
          envFrom:
            - configMapRef:
                name: anomstack-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.anomstack.resources.daemon | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f "dagster-daemon run" >/dev/null
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f "dagster-daemon run" >/dev/null
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: metrics
              mountPath: /opt/dagster/app/metrics
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: metrics
          configMap:
            name: anomstack-system-metrics
        - name: data
          persistentVolumeClaim:
            claimName: anomstack-data
        - name: tmp
          emptyDir: {}
{{- end }}
